[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Pre-existing, pinned, read-only (AGENTS.md hard rule 2). Never `cargo update` these.
oce-api = { git = "https://github.com/jscott3201/open-control-engine", rev = "fa5cb19d4b2b8831fb6a2979bc1d1099f69f3693" }
bacnet-objects = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "1caf4db71ac488720b17e343b9c50d43c15f62fc" }
bacnet-server = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "1caf4db71ac488720b17e343b9c50d43c15f62fc" }
bacnet-types = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "1caf4db71ac488720b17e343b9c50d43c15f62fc" }
bacnet-transport = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "1caf4db71ac488720b17e343b9c50d43c15f62fc" }
bacnet-client = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "1caf4db71ac488720b17e343b9c50d43c15f62fc" }
bacnet-encoding = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "1caf4db71ac488720b17e343b9c50d43c15f62fc" }

# Third-party
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ts-rs = "12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Official MCP Rust SDK, pinned exactly (README dependency table). Server and stdio only.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
anyhow = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Workspace crates
mm-graph = { path = "crates/mm-graph" }
mm-bridge = { path = "crates/mm-bridge" }
mm-agent = { path = "crates/mm-agent" }
mm-runtime = { path = "crates/mm-runtime" }
mm-bacnet = { path = "crates/mm-bacnet" }
mm-server = { path = "crates/mm-server" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
