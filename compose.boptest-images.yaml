# Override merged into BOPTEST's compose file by compose.yaml.
services:
  # The minio and mc releases BOPTEST names are no longer published as images, so both run from
  # one image built from source at those releases (deploy/minio; `make boptest-up` builds it).
  minio:
    image: mm-boptest-minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
  mc:
    image: mm-boptest-minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
  # The web service waits 20 min for a worker reply by default; under x86 emulation a 1-day
  # warm-up can take longer, so allow an hour (the client's own initialize timeout).
  web:
    environment:
      BOPTEST_MESSAGE_TIMEOUT: "3600000"
